name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-agent.txt
      - run: python -m pytest -q

  pgvector:
    # Runs the Postgres + pgvector backend tests against a real pgvector/pgvector:pg16 service container.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: examprep_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXAM_PREP_PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/examprep_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-agent.txt
      - name: Server version
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d examprep_test -c "select version();"
      - name: pgvector tests (must run, not skip)
        run: |
          python -m pytest tests/test_pgstore.py -v -rs | tee pg.log
          if grep -qi skipped pg.log; then echo "pgvector tests were skipped"; exit 1; fi
          grep -q passed pg.log
